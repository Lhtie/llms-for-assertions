name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set timestamp
      run: echo "IMAGE_TAG=$(date +%s)" >> $GITHUB_ENV

    - name: Create keysecrets.py with OpenAI API key
      run: |
        cat > keysecrets.py <<'EOF'
        oai_key = "${{ secrets.OPENAI_API_KEY }}"
        together_key = "${{ secrets.TOGETHER_API_KEY }}"
        EOF

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Free disk space
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
        sudo apt-get clean
        docker system prune -af || true
        df -h
    
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag hliu794/llms_for_assertions:${IMAGE_TAG}

    - name: Push the Docker image
      run: docker push hliu794/llms_for_assertions:${IMAGE_TAG}
      
